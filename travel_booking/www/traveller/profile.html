<!DOCTYPE html>
<html lang="en">
<head>
  {% with tv_title = "My Profile" %}
  {% include "templates/includes/traveller_head.html" %}
  {% endwith %}
</head>
<body class="tv-page">

{% include "templates/includes/traveller_nav.html" %}

<div class="body">
  <div class="tv-container ">

    <!-- Page Header -->
    <h1 class="tv-section-title">My Profile</h1>

    <!-- Loading State -->
    <div id="profile-loading" class="tv-text-center" style="padding:40px;">
      <div style="font-size:24px;color:var(--text-muted);">⏳ Loading...</div>
    </div>

    <!-- Content (populated by JS) -->
    <div id="profile-content" style="display:none;"></div>

    <!-- Message containers -->
    <div id="profile-error" class="tv-msg tv-msg--error" role="alert"></div>
    <div id="profile-success" class="tv-msg tv-msg--success" role="alert"></div>

  </div>
</div>

<script id="rcCurrencyData" type="application/json">{"company_currency": "{{ get_company_currency() }}", "company_symbol": "{{ get_company_symbol() }}"}</script>
<script type="application/json" id="pageData">{{ page_data | tojson | safe }}</script>
<script src="/assets/travel_booking/js/traveller_common.js?v={{ asset_v('js/traveller_common.js') }}"></script>
<script src="/assets/travel_booking/js/traveller_profile.js?v={{ asset_v('js/traveller_profile.js') }}"></script>
</body>
</html>
