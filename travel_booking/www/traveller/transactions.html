<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Transaction History — {{ site_name or 'Rarecation' }} Portal</title>
  <link rel="icon" href="/assets/travel_booking/img/faviconportal.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&family=Satisfy&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/travel_booking/css/portal.css?v={{ asset_v('css/portal.css') }}"/>
  <link rel="stylesheet" href="/assets/travel_booking/css/traveller.css?v={{ asset_v('css/traveller.css') }}"/>
</head>
<body class="tv-page">

{% include "templates/includes/traveller_nav.html" %}

<div class="body">
  <div class="tv-container">
    <!-- Page Header -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <h1 class="tv-section-title" style="margin-bottom:0;">📊 Transaction History</h1>

      <!-- Pagination Controls (Top) -->
      <div style="display:flex;align-items:center;gap:12px;">
        <!-- Rows per page selector -->
        <select id="tx-rows-per-page" class="tv-input tv-select" style="width:auto;padding:8px 28px 8px 10px;font-size:13px;" title="Rows per page">
          <option value="10">10 per page</option>
          <option value="20">20 per page</option>
          <option value="50">50 per page</option>
          <option value="100">100 per page</option>
        </select>

        <!-- Status filter -->
        <select id="tx-filter-status" class="tv-input tv-select" style="width:auto;padding:8px 28px 8px 10px;font-size:13px;">
          <option value="">All Status</option>
          <option value="Verified">Verified</option>
          <option value="Pending">Pending</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
    </div>

    <!-- Loading State -->
    <div id="tx-loading" class="tv-card tv-text-center" style="padding:60px 24px;">
      <div style="font-size:32px;color:var(--text-muted);margin-bottom:12px;">⏳</div>
      <p style="color:var(--text-muted);">Loading transactions...</p>
    </div>

    <!-- Content (populated by JS) -->
    <div id="tx-content" style="display:none;"></div>

    <!-- Pagination Navigation (populated by JS) -->
    <div id="tx-pagination" style="display:none;margin-top:24px;"></div>

    <!-- Empty State -->
    <div id="tx-empty" class="tv-empty" style="display:none;">
      <div class="tv-empty__icon">💳</div>
      <h3 class="tv-empty__title">No Transactions Yet</h3>
      <p class="tv-empty__desc">
        Your payment history will appear here once you make a booking or payment.
      </p>
      <a href="/trips" class="tv-btn tv-btn--primary">Browse Trips</a>
    </div>
  </div>
</div>

<script id="rcCurrencyData" type="application/json">{"company_currency": "{{ get_company_currency() }}", "company_symbol": "{{ get_company_symbol() }}"}</script>
<script type="application/json" id="pageData">{{ page_data | tojson | safe }}</script>
<script src="/assets/travel_booking/js/traveller_common.js?v={{ asset_v('js/traveller_common.js') }}"></script>
<script src="/assets/travel_booking/js/traveller_tx.js?v={{ asset_v('js/traveller_tx.js') }}"></script>
</body>
</html>
