<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Billing — Rarecation Portal</title>
  <link rel="icon" href="/assets/travel_booking/img/faviconportal.png"/>
  <link rel="stylesheet" href="/assets/travel_booking/css/portal.css?v={{ asset_v('css/portal.css') if asset_v is defined else '1' }}"/>
</head>
<body>

{% include "templates/includes/portal_nav.html" %}

<div class="body">
  <div class="inner" style="max-width:820px;">

    {% if not booking_ref %}
    <div class="card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:14px;color:#991B1B;">Booking reference missing.</div>
      <a href="/traveller_portal/bookings" class="btn btn-g" style="text-decoration:none;display:inline-block;margin-top:14px;font-size:12px;">← Back to My Bookings</a>
    </div>
    {% else %}

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <div>
        <div style="font-family:'DM Serif Display',serif;font-size:24px;color:#1E1C18;">Billing &amp; Payments</div>
        <div style="font-size:13px;color:#7D7A70;margin-top:3px;" id="billing-sub">{{ booking_ref }}</div>
      </div>
    </div>

    <div id="booking-pi-container">
      <div style="font-size:13px;color:#B0AC9F;padding:8px 0;">Loading payment details...</div>
    </div>

    {% endif %}

  </div>
</div>

<script type="application/json" id="pageData">{"csrf_token": "{{ csrf_token }}"}</script>
<script src="/assets/travel_booking/js/portal_common.js?v={{ asset_v('js/portal_common.js') if asset_v is defined else '1' }}"></script>
<script src="/assets/travel_booking/js/portal_billing.js?v={{ asset_v('js/portal_billing.js') if asset_v is defined else '1' }}"></script>
</body>
</html>
