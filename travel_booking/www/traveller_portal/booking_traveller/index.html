<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveller Details — Rarecation Portal</title>
  <link rel="icon" href="/assets/travel_booking/img/faviconportal.png"/>
  <link rel="stylesheet" href="/assets/travel_booking/css/portal.css?v={{ asset_v('css/portal.css') if asset_v is defined else '1' }}"/>
</head>
<body>

{% include "templates/includes/portal_nav.html" %}

<div class="body">
  <div class="inner" style="max-width:720px;">

    {% if not booking_ref %}
    <div class="card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:14px;color:#991B1B;">Booking reference missing.</div>
      <a href="/traveller_portal/bookings" class="btn btn-g" style="text-decoration:none;display:inline-block;margin-top:14px;font-size:12px;">← Back to My Bookings</a>
    </div>
    {% else %}

    <!-- ══ SENARAI TRAVELLER (Booking Reservation slot) ══ -->
    <div class="sc-page" id="V-slots">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <div>
          <div style="font-family:'DM Serif Display',serif;font-size:24px;color:#1E1C18;">Traveller Details</div>
          <div style="font-size:13px;color:#7D7A70;margin-top:3px;" id="tvl-page-sub">Loading...</div>
        </div>
      </div>

      <!-- Stepper progress -->
      <div class="prog-box" style="margin-bottom:16px;">
        <div class="prog-row" id="tvl-progress-label"><span>Loading travellers...</span><span></span></div>
        <div class="prog-bar"><div class="prog-fill" id="tvl-progress-fill" style="width:0%;"></div></div>
      </div>

      <div id="tvl-locked-notice" class="info-note" style="display:none;">
        <p id="tvl-locked-notice-text"></p>
      </div>

      <div id="traveller-slots-container">Loading travellers...</div>
    </div>
    {% endif %}

  </div>
</div>

<script type="application/json" id="pageData">{"csrf_token": "{{ csrf_token }}", "booking_ref": "{{ booking_ref }}"}</script>
<script src="/assets/travel_booking/js/portal_common.js?v={{ asset_v('js/portal_common.js') if asset_v is defined else '1' }}"></script>
<script src="/assets/travel_booking/js/portal_traveller_page.js?v={{ asset_v('js/portal_traveller_page.js') if asset_v is defined else '1' }}"></script>
</body>
</html>
