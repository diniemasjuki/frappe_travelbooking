<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bookings — Rarecation Portal</title>
  <link rel="icon" href="/assets/travel_booking/img/faviconportal.png"/>
  <link rel="stylesheet" href="/assets/travel_booking/css/portal.css?v={{ asset_v('css/portal.css') if asset_v is defined else '1' }}"/>
</head>
<body>

{% include "templates/includes/portal_nav.html" %}

<div class="body">
  <div class="inner" style="max-width:820px;">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;">
      <div>
        <div style="font-family:'DM Serif Display',serif;font-size:26px;color:#1E1C18;">My Bookings</div>
        <div style="font-size:13px;color:#7D7A70;margin-top:3px;">All your trip bookings, grouped by departure.</div>
      </div>
      <a href="/booking" class="btn btn-p" style="text-decoration:none;display:inline-block;white-space:nowrap;font-size:13px;">+ New Trip Booking</a>
    </div>

    <div id="bookings-content">
      <div id="bookings-loading" style="text-align:center;padding:48px 0;color:#B0AC9F;font-size:13px;">
        Loading your bookings...
      </div>
    </div>

  </div>
</div>

<script type="application/json" id="pageData">{"csrf_token": "{{ csrf_token }}"}</script>
<script src="/assets/travel_booking/js/portal_common.js?v={{ asset_v('js/portal_common.js') if asset_v is defined else '1' }}"></script>
<script src="/assets/travel_booking/js/portal_list.js?v={{ asset_v('js/portal_list.js') if asset_v is defined else '1' }}"></script>
</body>
</html>
